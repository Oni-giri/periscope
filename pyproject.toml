[project]
name = "periscope"
version = "0.1.0"
description = "A self-hosted, finite X/Twitter digest"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.49",
  "apscheduler>=3.11,<4",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "mcp>=1.27,<2",
  "python-multipart>=0.0.20",
  "python-telegram-bot>=21",
  "sqlite-utils>=3.38",
  "twscrape>=0.17",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.11",
]

[project.scripts]
periscope-daily = "periscope.jobs.daily:main"
periscope-fetch = "periscope.jobs.fetchonly:main"
periscope-weekly = "periscope.jobs.weekly:main"
periscope-mcp = "periscope.mcp_server:main"
periscope-mcp-http = "periscope.mcp_server:http_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["periscope"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: opt-in checks that contact configured external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
