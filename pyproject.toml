[project]
name = "periscope"
version = "0.1.0"
description = "A self-hosted, finite X/Twitter digest"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.49",
  "apscheduler>=3.11,<4",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "mcp>=1.27,<2",
  "python-multipart>=0.0.20",
  "python-telegram-bot>=21",
  "sqlite-utils>=3.38",
  "twscrape>=0.17",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.11",
]
scrape = [
  "playwright>=1.49",
  "httpx>=0.27",
]

[project.scripts]
periscope-daily = "periscope.jobs.daily:main"
periscope-fetch = "periscope.jobs.fetchonly:main"
periscope-weekly = "periscope.jobs.weekly:main"
periscope-mcp = "periscope.mcp_server:main"
periscope-mcp-http = "periscope.mcp_server:http_main"
periscope-scrape = "periscope.x_scrape.scrape_feeds:main"
periscope-curate = "periscope.x_scrape.curate_feeds:main"
periscope-shortlist = "periscope.x_scrape.shortlist_to_digest:main"
periscope-digest = "periscope.x_scrape.digest_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["periscope"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: opt-in checks that contact configured external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"periscope/x_scrape/scrape_feeds.py" = ["E501"]
"periscope/x_scrape/curate_feeds.py" = ["E501"]
